<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#d4e8e0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#c8dce8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8d0d8;stop-opacity:1" />
    </linearGradient>

    <!-- 远山渐变 -->
    <linearGradient id="farMountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8ba8b8;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#a0c0d0;stop-opacity:0.4" />
    </linearGradient>

    <!-- 中山渐变 -->
    <linearGradient id="midMountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6a90a0;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#80a8b8;stop-opacity:0.5" />
    </linearGradient>

    <!-- 近山渐变 -->
    <linearGradient id="nearMountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a8090;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#70a0b0;stop-opacity:0.6" />
    </linearGradient>

    <!-- 水面渐变 -->
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8d0e0;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#90c0d0;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#80b8c8;stop-opacity:0.4" />
    </linearGradient>

    <!-- 云彩渐变 -->
    <radialGradient id="cloudGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#f0f8ff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#e0f0f8;stop-opacity:0.3" />
    </radialGradient>

    <!-- 亭子渐变 -->
    <linearGradient id="pavilionRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="pavilionPillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a0522d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cd853f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
    </linearGradient>

    <!-- 模糊效果 -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- 天空 -->
  <rect width="100%" height="100%" fill="url(#skyGradient)"/>

  <!-- 远山（最远层） -->
  <g filter="url(#blur)" opacity="0.5">
    <path d="M0,600 Q200,400 400,500 T800,450 T1200,480 T1600,420 T1920,500 L1920,700 L0,700 Z"
          fill="url(#farMountain)"/>
  </g>

  <!-- 中山 -->
  <g filter="url(#softBlur)" opacity="0.6">
    <path d="M0,650 Q150,500 350,580 T700,520 T1000,560 T1400,500 T1920,580 L1920,750 L0,750 Z"
          fill="url(#midMountain)"/>
  </g>

  <!-- 近山 -->
  <g opacity="0.7">
    <path d="M0,700 Q100,600 300,660 T600,620 T900,650 T1300,610 T1920,660 L1920,800 L0,800 Z"
          fill="url(#nearMountain)"/>
  </g>

  <!-- 水面 -->
  <rect x="0" y="750" width="100%" height="330" fill="url(#waterGradient)"/>

  <!-- 水面波纹 -->
  <g opacity="0.3">
    <path d="M0,800 Q100,795 200,800 T400,800 T600,795 T800,800 T1000,800 T1200,795 T1400,800 T1600,800 T1920,795"
          fill="none" stroke="#ffffff" stroke-width="1"/>
    <path d="M0,830 Q150,825 300,830 T600,830 T900,825 T1200,830 T1500,830 T1920,825"
          fill="none" stroke="#ffffff" stroke-width="0.8"/>
    <path d="M0,860 Q200,855 400,860 T800,860 T1200,855 T1600,860 T1920,855"
          fill="none" stroke="#ffffff" stroke-width="0.6"/>
  </g>

  <!-- 云彩 -->
  <g class="clouds">
    <!-- 左上云 -->
    <ellipse cx="200" cy="150" rx="120" ry="40" fill="url(#cloudGradient)" opacity="0.8"/>
    <ellipse cx="180" cy="140" rx="80" ry="35" fill="url(#cloudGradient)" opacity="0.7"/>
    <ellipse cx="240" cy="145" rx="90" ry="30" fill="url(#cloudGradient)" opacity="0.6"/>

    <!-- 右上云 -->
    <ellipse cx="1600" cy="120" rx="150" ry="45" fill="url(#cloudGradient)" opacity="0.7"/>
    <ellipse cx="1620" cy="110" rx="100" ry="40" fill="url(#cloudGradient)" opacity="0.6"/>
    <ellipse cx="1580" cy="115" rx="110" ry="35" fill="url(#cloudGradient)" opacity="0.5"/>

    <!-- 中间云 -->
    <ellipse cx="900" cy="180" rx="180" ry="50" fill="url(#cloudGradient)" opacity="0.6"/>
    <ellipse cx="920" cy="170" rx="120" ry="45" fill="url(#cloudGradient)" opacity="0.5"/>
    <ellipse cx="880" cy="175" rx="130" ry="40" fill="url(#cloudGradient)" opacity="0.4"/>

    <!-- 山间云雾 -->
    <ellipse cx="400" cy="550" rx="200" ry="30" fill="url(#cloudGradient)" opacity="0.4"/>
    <ellipse cx="1200" cy="520" rx="180" ry="25" fill="url(#cloudGradient)" opacity="0.35"/>
  </g>

  <!-- 亭子（右侧山丘上） -->
  <g transform="translate(1400, 600)">
    <!-- 亭子底座 -->
    <rect x="-30" y="0" width="60" height="5" fill="#8b4513" opacity="0.8"/>

    <!-- 亭子柱子 -->
    <rect x="-25" y="-50" width="4" height="50" fill="url(#pavilionPillar)"/>
    <rect x="21" y="-50" width="4" height="50" fill="url(#pavilionPillar)"/>

    <!-- 亭子屋顶 -->
    <path d="M-40,-50 Q0,-80 40,-50" fill="url(#pavilionRoof)" stroke="#654321" stroke-width="1"/>
    <path d="M-35,-50 Q0,-75 35,-50" fill="none" stroke="#a0522d" stroke-width="0.5"/>

    <!-- 屋顶装饰 -->
    <circle cx="0" cy="-78" r="3" fill="#cd853f"/>
  </g>

  <!-- 左侧小亭 -->
  <g transform="translate(300, 620)">
    <rect x="-20" y="0" width="40" height="4" fill="#8b4513" opacity="0.7"/>
    <rect x="-16" y="-35" width="3" height="35" fill="url(#pavilionPillar)" opacity="0.8"/>
    <rect x="13" y="-35" width="3" height="35" fill="url(#pavilionPillar)" opacity="0.8"/>
    <path d="M-28,-35 Q0,-55 28,-35" fill="url(#pavilionRoof)" stroke="#654321" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- 松树（左侧） -->
  <g transform="translate(150, 640)" opacity="0.7">
    <rect x="-2" y="0" width="4" height="40" fill="#5a4a3a"/>
    <ellipse cx="0" cy="-10" rx="25" ry="30" fill="#3a5a4a" opacity="0.8"/>
    <ellipse cx="-10" cy="0" rx="20" ry="25" fill="#4a6a5a" opacity="0.7"/>
    <ellipse cx="10" cy="5" rx="18" ry="22" fill="#3a5a4a" opacity="0.6"/>
  </g>

  <!-- 右侧松树 -->
  <g transform="translate(1700, 630)" opacity="0.6">
    <rect x="-2" y="0" width="4" height="45" fill="#5a4a3a"/>
    <ellipse cx="0" cy="-15" rx="30" ry="35" fill="#3a5a4a" opacity="0.7"/>
    <ellipse cx="-12" cy="-5" rx="22" ry="28" fill="#4a6a5a" opacity="0.6"/>
    <ellipse cx="12" cy="0" rx="20" ry="25" fill="#3a5a4a" opacity="0.5"/>
  </g>

  <!-- 小船（水面） -->
  <g transform="translate(800, 820)" opacity="0.5">
    <path d="M-20,0 Q0,-8 20,0" fill="#8b4513" stroke="#654321" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#654321" stroke-width="1"/>
    <path d="M0,-25 Q10,-20 5,-10" fill="none" stroke="#f5f5dc" stroke-width="0.5"/>
  </g>

  <!-- 远处小船 -->
  <g transform="translate(1200, 790)" opacity="0.3">
    <path d="M-12,0 Q0,-5 12,0" fill="#8b4513"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#654321" stroke-width="0.8"/>
  </g>

  <!-- 飞鸟 -->
  <g fill="none" stroke="#5a6a7a" stroke-width="1.2" opacity="0.4">
    <path d="M500,200 Q510,195 520,200 Q530,195 540,200"/>
    <path d="M550,180 Q558,176 566,180 Q574,176 582,180"/>
    <path d="M1300,220 Q1308,216 1316,220 Q1324,216 1332,220"/>
  </g>
</svg>
