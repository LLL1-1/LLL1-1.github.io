<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类 | LLL1-1's Blog</title>
  <style>
    /* ============================================
       Fluid 风格 — 变量
       ============================================ */
    :root {
      --navbar-bg: rgba(47, 65, 84, 0.95);
      --board-bg: #ffffff;
      --text-color: #3c4858;
      --sec-text-color: #718096;
      --link-color: #30a9de;
      --body-bg: #f0f3f6;
      --ink-green: #b4d2be;
      --ink-blue: #a8d0e0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'STKaiti', 'KaiTi', 'Microsoft YaHei', serif;
      background: var(--body-bg);
      color: var(--text-color);
      overflow-x: hidden;
    }

    /* ============================================
       全屏 Banner
       ============================================ */
    .banner {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .banner.tall { height: 100vh; }
    .banner.small { height: 40vh; }

    .banner-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .banner-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }

    /* 轻遮罩 */
    .banner-mask {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.05) 0%,
        rgba(255, 255, 255, 0.12) 55%,
        rgba(255, 255, 255, 0.5) 100%);
    }

    /* Banner 中央文字 */
    .banner-content {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
      width: 90%;
    }

    .banner-title {
      font-size: 3.2em;
      letter-spacing: 8px;
      margin-bottom: 18px;
      background: linear-gradient(120deg, #2a7ab5 0%, #3a9a8a 50%, #2a7ab5 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 5s linear infinite;
    }

    @keyframes shine {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .banner-subtitle {
      font-size: 1.25em;
      color: #4a6a7a;
      letter-spacing: 5px;
      min-height: 1.8em;
    }

    .typed-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #4a6a7a;
      margin-left: 4px;
      vertical-align: -0.15em;
      animation: blink 0.9s infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* 下滑箭头 */
    .scroll-down {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.45s ease;
    }

    .scroll-down.hide {
      opacity: 0;
      pointer-events: none;
    }

    .scroll-down .arrow {
      width: 26px;
      height: 26px;
      border-right: 3px solid rgba(74, 106, 122, 0.8);
      border-bottom: 3px solid rgba(74, 106, 122, 0.8);
      transform: rotate(45deg);
      margin: 0 auto;
      animation: bounce 1.8s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 0.6; }
      50% { transform: rotate(45deg) translate(8px, 8px); opacity: 1; }
    }

    /* ============================================
       导航栏 — 初始透明，滚动后变色
       ============================================ */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 50px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      transition: background 0.35s ease, box-shadow 0.35s ease, backdrop-filter 0.35s ease;
    }

    .nav.scrolled {
      background: rgba(47, 65, 84, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
    }

    .nav-brand {
      position: absolute;
      left: 50px;
      font-size: 1.45em;
      color: #2a4a5a;
      text-decoration: none;
      letter-spacing: 3px;
      font-weight: bold;
      transition: color 0.35s;
    }

    .nav.scrolled .nav-brand { color: #fff; }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      color: #3a5a6a;
      text-decoration: none;
      font-size: 1em;
      letter-spacing: 2px;
      position: relative;
      transition: color 0.35s;
    }

    .nav.scrolled .nav-links a { color: rgba(255, 255, 255, 0.85); }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -6px; left: 50%;
      width: 0; height: 2px;
      background: var(--link-color);
      transform: translateX(-50%);
      transition: width 0.3s;
    }

    .nav-links a:hover::after { width: 100%; }

    /* ============================================
       白色面板（上浮覆盖 Banner）
       ============================================ */
    .board {
      position: relative;
      max-width: 860px;
      margin: 40px auto 0;
      background: var(--board-bg);
      border-radius: 10px;
      padding: 40px 45px;
      box-shadow: 0 4px 20px rgba(60, 90, 110, 0.12);
      z-index: 5;
      overflow: hidden;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .board.visible {
      opacity: 1;
      transform: translateY(calc(-1 * var(--lift, 0px)));
    }

    /* 面板顶部渐变饰条 */
    .board::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #a8d8ea, #b5e0c4, #a8d8ea);
      background-size: 200% 100%;
      animation: flow 6s linear infinite;
    }

    @keyframes flow {
      0% { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    /* ============================================
       首页文章卡片 — 左图右文
       ============================================ */
    .index-card {
      display: flex;
      gap: 24px;
      padding: 26px 18px;
      margin: 0 -18px;
      border-bottom: 1px solid rgba(168, 208, 224, 0.35);
      border-radius: 10px;
      transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }

    .index-card:first-child { padding-top: 8px; }
    .index-card:last-child { border-bottom: none; }

    .index-card:hover {
      background: linear-gradient(90deg, rgba(168, 216, 234, 0.12), rgba(181, 224, 196, 0.12));
      box-shadow: 0 6px 18px rgba(60, 130, 160, 0.1);
      transform: translateY(-3px);
    }

    .index-img {
      flex-shrink: 0;
      width: 240px;
      height: 150px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(60, 90, 110, 0.18);
    }

    .index-img svg, .index-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .index-card:hover .index-img svg,
    .index-card:hover .index-img img {
      transform: scale(1.06);
    }

    .index-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .index-title {
      font-size: 1.4em;
      color: var(--text-color);
      margin-bottom: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .index-title a {
      color: inherit;
      text-decoration: none;
      transition: color 0.3s;
    }

    .index-title a:hover { color: var(--link-color); }

    .index-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--sec-text-color);
      font-size: 0.88em;
      margin-bottom: 10px;
    }

    .index-tag {
      color: #2a8ab8;
      background: linear-gradient(90deg, rgba(168, 216, 234, 0.35), rgba(181, 224, 196, 0.35));
      padding: 2px 12px;
      border-radius: 12px;
      font-size: 0.92em;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .index-card:hover .index-tag {
      transform: translateY(-2px);
      box-shadow: 0 3px 8px rgba(60, 130, 160, 0.15);
    }

    .index-excerpt {
      color: var(--sec-text-color);
      font-size: 0.95em;
      line-height: 1.8;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ============================================
       文章详情
       ============================================ */
    .post-header { margin-bottom: 28px; }

    .post-header h1 {
      font-size: 1.9em;
      color: var(--text-color);
      margin-bottom: 12px;
    }

    .post-header .index-meta { margin-bottom: 0; }

    .post-body {
      font-size: 1.05em;
      line-height: 2;
      color: var(--text-color);
    }

    .post-body h2 {
      font-size: 1.4em;
      margin: 28px 0 14px;
      border-left: 4px solid var(--ink-blue);
      padding-left: 14px;
    }

    .post-body h3 {
      font-size: 1.2em;
      margin: 22px 0 10px;
    }

    .post-body p { margin-bottom: 16px; }

    .post-body a {
      color: var(--link-color);
      text-decoration: none;
      border-bottom: 1px solid rgba(48, 169, 222, 0.35);
    }

    .post-body blockquote {
      background: rgba(168, 208, 224, 0.12);
      border-left: 4px solid var(--ink-blue);
      padding: 14px 20px;
      margin: 18px 0;
      border-radius: 0 6px 6px 0;
      color: var(--sec-text-color);
      font-style: italic;
    }

    .post-body code {
      background: rgba(168, 208, 224, 0.18);
      padding: 2px 7px;
      border-radius: 4px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.88em;
    }

    .post-body pre {
      background: rgba(40, 55, 65, 0.94);
      color: #d4e8e0;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 18px 0;
    }

    .post-body pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    .post-body ul, .post-body ol {
      padding-left: 26px;
      margin-bottom: 16px;
    }

    .post-body img {
      max-width: 100%;
      border-radius: 6px;
    }

    /* ============================================
       页脚 / 分页 / 回到顶部
       ============================================ */
    .footer {
      text-align: center;
      padding: 34px 0 40px;
      color: var(--sec-text-color);
      font-size: 0.9em;
      letter-spacing: 1px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding-top: 26px;
    }

    .pagination a {
      color: var(--sec-text-color);
      text-decoration: none;
      padding: 7px 18px;
      border-radius: 6px;
      background: var(--body-bg);
      transition: all 0.3s;
    }

    .pagination a:hover { background: rgba(168, 208, 224, 0.35); color: var(--text-color); }

    .back-top {
      position: fixed;
      bottom: 32px; right: 32px;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: rgba(47, 65, 84, 0.75);
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 1.2em;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 99;
    }

    .back-top.show { opacity: 1; pointer-events: auto; }
    .back-top:hover { background: rgba(47, 65, 84, 0.95); }

    /* ============================================
       水墨开篇动效（每次刷新触发，总时长 1 秒）
       拨开云雾见青天
       ============================================ */
    .ink-intro {
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
      /* 底层：白色云海 */
      background:
        radial-gradient(ellipse 80% 55% at 20% 20%, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0) 70%),
        radial-gradient(ellipse 75% 50% at 80% 25%, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0) 70%),
        radial-gradient(ellipse 90% 60% at 50% 85%, rgba(255, 255, 255, 0.97) 0%, rgba(255, 255, 255, 0) 72%),
        linear-gradient(180deg, rgba(244, 250, 252, 0.9), rgba(238, 246, 242, 0.88));
      animation: skyReveal 0.5s cubic-bezier(0.4, 0, 0.3, 1) forwards;
    }

    /* 青天渐现：中央先亮，四周云退 */
    @keyframes skyReveal {
      0% { opacity: 1; }
      55% { opacity: 0.75; }
      100% { opacity: 0; }
    }

    .ink-cloud {
      position: absolute;
      border-radius: 50%;
      filter: blur(14px);
      will-change: transform, opacity;
    }

    /* 明显的白云团（轮廓较实，不是纯雾） */
    .ink-c1 {
      width: 46vw; height: 30vh; top: 6%; left: -10%;
      background: radial-gradient(ellipse at 45% 50%, #ffffff 0%, rgba(255, 255, 255, 0.92) 45%, rgba(255, 255, 255, 0) 72%);
      box-shadow: inset 0 0 60px rgba(176, 208, 220, 0.35);
      animation: drift1 0.48s cubic-bezier(0.35, 0, 0.3, 1) forwards;
    }
    .ink-c2 {
      width: 42vw; height: 27vh; top: 10%; right: -12%;
      background: radial-gradient(ellipse at 55% 50%, #ffffff 0%, rgba(255, 255, 255, 0.9) 45%, rgba(255, 255, 255, 0) 72%);
      box-shadow: inset 0 0 55px rgba(170, 205, 190, 0.35);
      animation: drift2 0.48s cubic-bezier(0.35, 0, 0.3, 1) 0.04s forwards;
    }
    .ink-c3 {
      width: 52vw; height: 26vh; bottom: -4%; left: 20%;
      background: radial-gradient(ellipse at 50% 50%, #ffffff 0%, rgba(255, 255, 255, 0.93) 48%, rgba(255, 255, 255, 0) 74%);
      box-shadow: inset 0 0 65px rgba(176, 205, 218, 0.3);
      animation: drift3 0.5s cubic-bezier(0.35, 0, 0.3, 1) 0.02s forwards;
    }
    .ink-c4 {
      width: 36vw; height: 24vh; top: 32%; left: 2%;
      background: radial-gradient(ellipse at 50% 50%, #ffffff 0%, rgba(255, 255, 255, 0.88) 42%, rgba(255, 255, 255, 0) 70%);
      animation: drift4 0.45s cubic-bezier(0.35, 0, 0.3, 1) 0.06s forwards;
    }
    .ink-c5 {
      width: 34vw; height: 22vh; bottom: 12%; right: -6%;
      background: radial-gradient(ellipse at 50% 50%, #ffffff 0%, rgba(255, 255, 255, 0.9) 44%, rgba(255, 255, 255, 0) 70%);
      animation: drift5 0.48s cubic-bezier(0.35, 0, 0.3, 1) 0.03s forwards;
    }
    .ink-c6 {
      width: 30vw; height: 20vh; top: 18%; left: 32%;
      background: radial-gradient(ellipse at 50% 50%, #ffffff 0%, rgba(255, 255, 255, 0.85) 40%, rgba(255, 255, 255, 0) 68%);
      animation: drift6 0.45s cubic-bezier(0.35, 0, 0.3, 1) 0.08s forwards;
    }

    @keyframes drift1 { 25% { opacity: 1; } to { transform: translate(-38vw, -16vh) scale(1.55); opacity: 0; } }
    @keyframes drift2 { 25% { opacity: 1; } to { transform: translate(34vw, -13vh) scale(1.5); opacity: 0; } }
    @keyframes drift3 { 25% { opacity: 1; } to { transform: translate(-14vw, 26vh) scale(1.6); opacity: 0; } }
    @keyframes drift4 { 25% { opacity: 1; } to { transform: translate(26vw, 10vh) scale(1.45); opacity: 0; } }
    @keyframes drift5 { 25% { opacity: 1; } to { transform: translate(-24vw, 14vh) scale(1.5); opacity: 0; } }
    @keyframes drift6 { 25% { opacity: 1; } to { transform: translate(6vw, -24vh) scale(1.4); opacity: 0; } }

    /* 墨丝笔触（快速划过） */
    .ink-stroke {
      position: absolute;
      border-radius: 50%;
      filter: blur(12px);
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0));
    }
    .ink-s1 { width: 44vw; height: 6vh; top: 26%; left: 8%; transform: rotate(-8deg); animation: strokeOut 0.42s ease-out 0.1s forwards; }
    .ink-s2 { width: 36vw; height: 5vh; top: 56%; right: 6%; transform: rotate(6deg); animation: strokeOut 0.42s ease-out 0.05s forwards; }
    .ink-s3 { width: 30vw; height: 4vh; bottom: 20%; left: 22%; transform: rotate(-4deg); animation: strokeOut 0.42s ease-out 0.12s forwards; }

    @keyframes strokeOut {
      0% { opacity: 0.95; }
      100% { opacity: 0; transform: rotate(0deg) scaleX(1.9) translateX(9vw); }
    }

    /* ============================================
       头像（Banner 右上角，随页面滚动）
       ============================================ */
    .avatar-box {
      position: fixed;
      top: 76px;
      right: 32px;
      z-index: 110;
      width: 96px;
      height: 96px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.25),
        0 0 0 3px rgba(255, 255, 255, 0.3),
        0 0 0 5px rgba(168, 216, 234, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      border: 2.5px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.12);
      transition: transform 0.35s ease, box-shadow 0.35s ease, opacity 0.4s ease;
      cursor: pointer;
      animation: avatarPulse 3s ease-in-out infinite;
    }


    @keyframes avatarPulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(0,0,0,0.25), 0 0 0 3px rgba(255,255,255,0.3), 0 0 0 5px rgba(168,216,234,0.4), inset 0 1px 0 rgba(255,255,255,0.35); }
      50% { box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 0 3px rgba(255,255,255,0.5), 0 0 0 7px rgba(168,216,234,0.6), inset 0 1px 0 rgba(255,255,255,0.45); }
    }

    .avatar-box:hover {
      transform: scale(1.08);
      animation: none;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.35),
        0 0 0 3px rgba(255, 255, 255, 0.5),
        0 0 0 6px rgba(168, 216, 234, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 11px;
    }


    /* ============================================
       滚动条（默认隐藏，滚动/悬浮时显示）
       ============================================ */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 3px;
      transition: background 0.3s;
    }

    /* 滚动时显示 */
    body.scrolling ::-webkit-scrollbar-thumb {
      background: rgba(47, 65, 84, 0.6);
    }

    /* 悬浮在滚动区域时显示 */
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(47, 65, 84, 0.75) !important;
    }

    /* ============================================
       响应式
       ============================================ */
    @media (max-width: 768px) {
      .nav { padding: 0 20px; }
      .nav-brand { left: 20px; }
      .nav-links { gap: 16px; }
      .banner-title { font-size: 2em; letter-spacing: 4px; }
      .avatar-box { width: 60px; height: 60px; top: 66px; right: 16px; }
      .board { margin: 30px 14px 0; padding: 24px 20px; }
      .index-card { flex-direction: column; }
      .index-img { width: 100%; height: 180px; }
      .index-title { white-space: normal; }
    }
  </style>

  <script>
    // 滚动条：滚动时显示，停顿后隐藏
    (function() {
      var timer;
      window.addEventListener('scroll', function() {
        document.body.classList.add('scrolling');
        clearTimeout(timer);
        timer = setTimeout(function() {
          document.body.classList.remove('scrolling');
        }, 600);
      }, { passive: true });

    // 导航栏滚动变色 + 回到顶部 + 箭头淡出 + 面板视差 + 头像固定
    var nav = document.getElementById('nav');
    var backTop = document.getElementById('backTop');
    var scrollDown = document.querySelector('.scroll-down');
    var board = document.querySelector('.board');
    var avatar = document.querySelector('.avatar-box');
    var banner = document.querySelector('.banner');
    window.addEventListener('scroll', function() {
      var y = window.scrollY;
      nav.classList.toggle('scrolled', y > 60);
      backTop.classList.toggle('show', y > 400);
      if (scrollDown) {
        scrollDown.classList.toggle('hide', y > 80);
      }
      // 面板视差
      if (board && board.classList.contains('visible')) {
        board.style.setProperty('--lift', Math.min(y * 0.3, 120) + 'px');
      }
    }, { passive: true });

    // 打字机效果
    (function() {
      var el = document.getElementById('typed');
      if (!el) return;
      var text = el.textContent;
      el.textContent = '';
      var i = 0;
      function type() {
        if (i < text.length) {
          el.textContent += text.charAt(i++);
          setTimeout(type, 120);
        }
      }
      setTimeout(type, 800);
    })();

    // 面板滚动浮现
    (function() {
      var board = document.querySelector('.board');
      if (!board) return;
      // 出现动画结束后移除 transform 过渡，让视差即时跟随
      board.addEventListener('transitionend', function once(e) {
        if (e.propertyName === 'transform') {
          board.style.transition = 'opacity 0.7s ease';
          board.removeEventListener('transitionend', once);
        }
      });
      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function(entries) {
          entries.forEach(function(e) {
            if (e.isIntersecting) {
              board.classList.add('visible');
              io.disconnect();
            }
          });
        }, { threshold: 0.1 });
        io.observe(board);
      } else {
        board.classList.add('visible');
      }
    })();
  </script>

</body>
</html>
