<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类 | LLL1-1's Blog</title>
  <style>
    /* ============================================
       Fluid 风格 — 变量
       ============================================ */
    :root {
      --navbar-bg: rgba(47, 65, 84, 0.95);
      --board-bg: #ffffff;
      --text-color: #3c4858;
      --sec-text-color: #718096;
      --link-color: #30a9de;
      --body-bg: #f0f3f6;
      --ink-green: #b4d2be;
      --ink-blue: #a8d0e0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'STKaiti', 'KaiTi', 'Microsoft YaHei', serif;
      background: rgba(240, 243, 246, 0.65);
      color: var(--text-color);
      overflow-x: hidden;
    }

    /* ============================================
       全屏 Banner
       ============================================ */
    .banner {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .banner.tall { height: 100vh; }
    .banner.small { height: 40vh; }

    .banner-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .banner-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }

    /* 轻遮罩 */
    .banner-mask {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.05) 0%,
        rgba(255, 255, 255, 0.12) 55%,
        rgba(255, 255, 255, 0.5) 100%);
    }

    /* Banner 中央文字 */
    .banner-content {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
      width: 90%;
    }

    .banner-title {
      font-size: 3.2em;
      letter-spacing: 8px;
      margin-bottom: 18px;
      background: linear-gradient(120deg, #2a7ab5 0%, #3a9a8a 50%, #2a7ab5 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 5s linear infinite;
    }

    @keyframes shine {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .banner-subtitle {
      font-size: 1.25em;
      color: #4a6a7a;
      letter-spacing: 5px;
      min-height: 1.8em;
    }

    .typed-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #4a6a7a;
      margin-left: 4px;
      vertical-align: -0.15em;
      animation: blink 0.9s infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* 下滑箭头 */
    .scroll-down {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.45s ease;
    }

    .scroll-down.hide {
      opacity: 0;
      pointer-events: none;
    }

    .scroll-down .arrow {
      width: 26px;
      height: 26px;
      border-right: 3px solid rgba(74, 106, 122, 0.8);
      border-bottom: 3px solid rgba(74, 106, 122, 0.8);
      transform: rotate(45deg);
      margin: 0 auto;
      animation: bounce 1.8s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 0.6; }
      50% { transform: rotate(45deg) translate(8px, 8px); opacity: 1; }
    }

    /* ============================================
       导航栏 — 初始透明，滚动后变色
       ============================================ */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 50px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      transition: background 0.35s ease, box-shadow 0.35s ease, backdrop-filter 0.35s ease;
    }

    .nav.scrolled {
      background: rgba(47, 65, 84, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
    }

    .nav-brand {
      position: absolute;
      left: 50px;
      font-size: 1.45em;
      color: #2a4a5a;
      text-decoration: none;
      letter-spacing: 3px;
      font-weight: bold;
      transition: color 0.35s;
    }

    .nav.scrolled .nav-brand { color: #fff; }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      color: #3a5a6a;
      text-decoration: none;
      font-size: 1em;
      letter-spacing: 2px;
      position: relative;
      transition: color 0.35s;
    }

    .nav.scrolled .nav-links a { color: rgba(255, 255, 255, 0.85); }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -6px; left: 50%;
      width: 0; height: 2px;
      background: var(--link-color);
      transform: translateX(-50%);
      transition: width 0.3s;
    }

    .nav-links a:hover::after { width: 100%; }

    /* ============================================
       固定背景图（主图下方，固定不动）
       ============================================ */
    .site-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url('/images/bg.jpg') center center / cover no-repeat;
      filter: brightness(1.05) opacity(0.8);
    }

    /* ============================================
       白色面板（上浮覆盖 Banner）
       ============================================ */
    .board {
      position: relative;
      max-width: 700px;
      margin: 40px auto 0;
      margin-left: auto;
      margin-right: auto;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 10px;
      padding: 32px 38px;
      box-shadow: 0 4px 20px rgba(60, 90, 110, 0.12);
      z-index: 5;
      overflow: hidden;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .board.visible {
      opacity: 1;
      transform: translateY(calc(-1 * var(--lift, 0px)));
    }

    /* 面板顶部渐变饰条 */
    .board::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #a8d8ea, #b5e0c4, #a8d8ea);
      background-size: 200% 100%;
      animation: flow 6s linear infinite;
    }

    @keyframes flow {
      0% { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    /* ============================================
       首页文章卡片 — 左图右文
       ============================================ */
    .index-card {
      display: flex;
      gap: 24px;
      padding: 26px 18px;
      margin: 0 -18px;
      border-bottom: 1px solid rgba(168, 208, 224, 0.35);
      border-radius: 10px;
      transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }

    .index-card:first-child { padding-top: 8px; }
    .index-card:last-child { border-bottom: none; }

    .index-card:hover {
      background: linear-gradient(90deg, rgba(168, 216, 234, 0.12), rgba(181, 224, 196, 0.12));
      box-shadow: 0 6px 18px rgba(60, 130, 160, 0.1);
      transform: translateY(-3px);
    }

    .index-img {
      flex-shrink: 0;
      width: 240px;
      height: 150px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(60, 90, 110, 0.18);
    }

    .index-img svg, .index-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .index-card:hover .index-img svg,
    .index-card:hover .index-img img {
      transform: scale(1.06);
    }

    .index-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .index-title {
      font-size: 1.4em;
      color: var(--text-color);
      margin-bottom: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .index-title a {
      color: inherit;
      text-decoration: none;
      transition: color 0.3s;
    }

    .index-title a:hover { color: var(--link-color); }

    .index-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--sec-text-color);
      font-size: 0.88em;
      margin-bottom: 10px;
    }

    .index-tag {
      color: #2a8ab8;
      background: linear-gradient(90deg, rgba(168, 216, 234, 0.35), rgba(181, 224, 196, 0.35));
      padding: 2px 12px;
      border-radius: 12px;
      font-size: 0.92em;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .index-card:hover .index-tag {
      transform: translateY(-2px);
      box-shadow: 0 3px 8px rgba(60, 130, 160, 0.15);
    }

    .index-excerpt {
      color: var(--sec-text-color);
      font-size: 0.95em;
      line-height: 1.8;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ============================================
       文章详情
       ============================================ */
    .post-header { margin-bottom: 28px; }

    .post-header h1 {
      font-size: 1.9em;
      color: var(--text-color);
      margin-bottom: 12px;
    }

    .post-header .index-meta { margin-bottom: 0; }

    .post-body {
      font-size: 1.05em;
      line-height: 2;
      color: var(--text-color);
    }

    .post-body h2 {
      font-size: 1.4em;
      margin: 28px 0 14px;
      border-left: 4px solid var(--ink-blue);
      padding-left: 14px;
    }

    .post-body h3 {
      font-size: 1.2em;
      margin: 22px 0 10px;
    }

    .post-body p { margin-bottom: 16px; }

    .post-body a {
      color: var(--link-color);
      text-decoration: none;
      border-bottom: 1px solid rgba(48, 169, 222, 0.35);
    }

    .post-body blockquote {
      background: rgba(168, 208, 224, 0.12);
      border-left: 4px solid var(--ink-blue);
      padding: 14px 20px;
      margin: 18px 0;
      border-radius: 0 6px 6px 0;
      color: var(--sec-text-color);
      font-style: italic;
    }

    .post-body code {
      background: rgba(168, 208, 224, 0.18);
      padding: 2px 7px;
      border-radius: 4px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.88em;
    }

    .post-body pre {
      background: rgba(40, 55, 65, 0.94);
      color: #d4e8e0;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 18px 0;
    }

    .post-body pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    .post-body ul, .post-body ol {
      padding-left: 26px;
      margin-bottom: 16px;
    }

    .post-body img {
      max-width: 100%;
      border-radius: 6px;
    }

    /* ============================================
       页脚 / 分页 / 回到顶部
       ============================================ */
    .footer {
      text-align: center;
      padding: 34px 0 40px;
      color: var(--sec-text-color);
      font-size: 0.9em;
      letter-spacing: 1px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding-top: 26px;
    }

    .pagination a {
      color: var(--sec-text-color);
      text-decoration: none;
      padding: 7px 18px;
      border-radius: 6px;
      background: var(--body-bg);
      transition: all 0.3s;
    }

    .pagination a:hover { background: rgba(168, 208, 224, 0.35); color: var(--text-color); }

    .back-top {
      position: fixed;
      bottom: 32px; right: 32px;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: rgba(47, 65, 84, 0.75);
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 1.2em;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 99;
    }

    .back-top.show { opacity: 1; pointer-events: auto; }
    .back-top:hover { background: rgba(47, 65, 84, 0.95); }

    /* ============================================
       长条抽离开篇动效（每次刷新触发，0.6 秒）
       ============================================ */
    .strip-intro {
      position: fixed;
      inset: -50vh -50vw;
      z-index: 200;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
      transform: rotate(-15deg);
    }

    .strip {
      width: 200vw;
      height: 6.5%;
      background: linear-gradient(90deg, #4a9ae8, #5aaaf2);
      border-radius: 60px;
      will-change: transform;
      flex-shrink: 0;
    }

    /* 奇数条往左直抽，偶数条往右直抽（沿容器斜向） */
    .strip:nth-child(odd) {
      animation: pullLeft 0.55s cubic-bezier(0.55, 0, 0.3, 1) forwards;
    }
    .strip:nth-child(even) {
      animation: pullRight 0.55s cubic-bezier(0.55, 0, 0.3, 1) forwards;
    }

    .strip:nth-child(1)  { animation-delay: 0.00s; }
    .strip:nth-child(2)  { animation-delay: 0.03s; }
    .strip:nth-child(3)  { animation-delay: 0.06s; }
    .strip:nth-child(4)  { animation-delay: 0.09s; }
    .strip:nth-child(5)  { animation-delay: 0.12s; }
    .strip:nth-child(6)  { animation-delay: 0.15s; }
    .strip:nth-child(7)  { animation-delay: 0.18s; }
    .strip:nth-child(8)  { animation-delay: 0.21s; }
    .strip:nth-child(9)  { animation-delay: 0.24s; }
    .strip:nth-child(10) { animation-delay: 0.27s; }
    .strip:nth-child(11) { animation-delay: 0.30s; }
    .strip:nth-child(12) { animation-delay: 0.33s; }
    .strip:nth-child(13) { animation-delay: 0.36s; }
    .strip:nth-child(14) { animation-delay: 0.39s; }
    .strip:nth-child(15) { animation-delay: 0.42s; }
    .strip:nth-child(16) { animation-delay: 0.45s; }

    @keyframes pullLeft {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-200vw); }
    }
    @keyframes pullRight {
      0%   { transform: translateX(0); }
      100% { transform: translateX(200vw); }
    }

    /* ============================================
       头像（Banner 右上角，随页面滚动）
       ============================================ */
    .avatar-box {
      position: fixed;
      top: 76px;
      right: 32px;
      z-index: 110;
      width: 96px;
      height: 96px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.25),
        0 0 0 3px rgba(255, 255, 255, 0.3),
        0 0 0 5px rgba(168, 216, 234, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      border: 2.5px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.12);
      transition: transform 0.35s ease, box-shadow 0.35s ease, opacity 0.4s ease;
      cursor: pointer;
      animation: avatarPulse 3s ease-in-out infinite;
    }


    @keyframes avatarPulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(0,0,0,0.25), 0 0 0 3px rgba(255,255,255,0.3), 0 0 0 5px rgba(168,216,234,0.4), inset 0 1px 0 rgba(255,255,255,0.35); }
      50% { box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 0 3px rgba(255,255,255,0.5), 0 0 0 7px rgba(168,216,234,0.6), inset 0 1px 0 rgba(255,255,255,0.45); }
    }

    .avatar-box:hover {
      transform: scale(1.08);
      animation: none;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.35),
        0 0 0 3px rgba(255, 255, 255, 0.5),
        0 0 0 6px rgba(168, 216, 234, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 11px;
    }

    /* Banner 滚出后头像淡出 */
    .avatar-box.fade-out {
      opacity: 0;
      pointer-events: none;
    }


    /* ============================================
       滚动条（默认隐藏，滚动/悬浮时显示）
       ============================================ */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 3px;
      transition: background 0.3s;
    }

    /* 滚动时显示 */
    body.scrolling ::-webkit-scrollbar-thumb {
      background: rgba(47, 65, 84, 0.6);
    }

    /* 悬浮在滚动区域时显示 */
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(47, 65, 84, 0.75) !important;
    }

    /* ============================================
       主页三栏布局（侧栏 + 文章 + 项目）
       ============================================ */
    .home-layout {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* 左侧个人资料栏 — 独立浮在背景图上 */
    .profile-card {
      position: fixed;
      top: 80px;
      left: 30px;
      width: 210px;
      background: linear-gradient(160deg, rgba(168, 216, 234, 0.5), rgba(255, 255, 255, 0.9) 60%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 20px 16px;
      box-shadow: 0 3px 16px rgba(74, 154, 232, 0.15);
      border: 1px solid rgba(168, 216, 234, 0.45);
      z-index: 20;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .profile-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 2px 10px rgba(74, 154, 232, 0.25);
    }

    .profile-name {
      font-size: 1.25em;
      color: #2a5a7a;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .profile-recent-title {
      font-size: 0.85em;
      color: #7a9aba;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(168, 216, 234, 0.5);
    }

    .profile-recent-list {
      list-style: none;
    }

    .profile-recent-list li {
      margin-bottom: 2px;
    }

    .profile-recent-list a {
      display: block;
      color: #4a6a8a;
      text-decoration: none;
      font-size: 0.88em;
      padding: 6px 8px;
      border-radius: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.25s ease;
    }

    .profile-recent-list a:hover {
      background: rgba(168, 216, 234, 0.3);
      color: #2a5a7a;
      transform: translateX(3px);
    }

    /* 右侧项目栏 — 独立浮在背景图上 */
    .projects-card {
      position: fixed;
      top: 80px;
      right: 30px;
      width: 280px;
      background: linear-gradient(200deg, rgba(168, 216, 234, 0.45), rgba(255, 255, 255, 0.9) 55%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 20px 16px;
      box-shadow: 0 3px 16px rgba(74, 154, 232, 0.15);
      border: 1px solid rgba(168, 216, 234, 0.45);
      z-index: 20;
    }

    .projects-title {
      font-size: 1.1em;
      color: #2a5a7a;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .project-item {
      display: block;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      text-decoration: none;
      border: 1px solid rgba(168, 216, 234, 0.35);
      transition: all 0.3s ease;
    }

    .project-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(74, 154, 232, 0.2);
      border-color: rgba(74, 154, 232, 0.5);
    }

    .project-item-name {
      color: #2a5a7a;
      font-size: 0.95em;
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .project-item-desc {
      color: #7a9aba;
      font-size: 0.8em;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .projects-more {
      display: block;
      text-align: center;
      color: #4a8aba;
      font-size: 0.88em;
      text-decoration: none;
      padding: 8px;
      border-radius: 6px;
      margin-top: 6px;
      transition: all 0.25s ease;
    }

    .projects-more:hover {
      background: rgba(168, 216, 234, 0.3);
      color: #2a5a7a;
    }

    /* 中间文章区 */
    .articles-col {
      flex: 1;
      min-width: 0;
    }

    /* ============================================
       响应式
       ============================================ */
    @media (max-width: 1100px) {
      .profile-card { left: 10px; width: 180px; }
      .projects-card { right: 10px; width: 240px; }
      .board { max-width: 600px; }
    }

    @media (max-width: 900px) {
      .profile-card, .projects-card { display: none; }
    }

    @media (max-width: 768px) {
